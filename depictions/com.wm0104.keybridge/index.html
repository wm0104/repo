<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>词库桥接</title>
  <style>
    body { margin: 0; padding: 24px 20px; font: 17px/1.6 -apple-system, BlinkMacSystemFont, sans-serif; overflow-wrap: anywhere; }
    main { max-width: 640px; margin: auto; }
    h1 { font-size: 28px; }
    h2 { font-size: 22px; margin-top: 28px; }
    h3 { font-size: 18px; }
    p { margin: 10px 0; }
  </style>
</head>
<body>
  <main>
    <h1>词库桥接</h1>
    <p>为苹果原生中文键盘接入本地 Rime 词库。</p>
    <p>分类：Ai插件</p>
    <section aria-labelledby="compatibility">
      <h2 id="compatibility">兼容说明</h2>
      <p>兼容测试范围：iOS 15.0–16.x，苹果中文键盘26键全拼与九宫格。</p>
      <p>目前仅在 iOS 16.3（roothide）真机验证，其他环境需测试。</p>
    </section>
    <section aria-labelledby="changelog">
      <h2 id="changelog">更新日志</h2>
      <h3>0.0.2</h3>
      <p>- 新增苹果原生候选习惯学习。</p>
      <p>- 修复学习记录保存与恢复。</p>
      <p>- 优化词库编辑及设置界面。</p>
    </section>
  </main>
</body>
</html>
