<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background: linear-gradient(
        135deg,
        #43cea2,
        #185a9d
    );

    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
}


.card {

    width: 85%;
    max-width: 400px;

    padding: 35px 25px;

    text-align: center;

    background: rgba(255,255,255,0.25);

    backdrop-filter: blur(20px);

    border-radius: 30px;

    box-shadow:

.title {

    font-size: 30px;

    font-weight: 700;

    color:white;

    margin-bottom:30px;

}


.button {

    display:block;

    width:100%;

    margin:18px auto;

    padding:16px;

    background:
    rgba(255,255,255,0.85);

    color:#2980ff;

    font-size:20px;

    font-weight:600;

    text-decoration:none;

    transition:.2s;

}


.button:active {

    transform:scale(0.95);

}


.footer {

    margin-top:20px;

    color:white;

    font-size:14px;

    opacity:.8;

}

</style>
