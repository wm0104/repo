* {

body {

    align-items:center;


    background:#f2f2f7;


    font-family:
    -apple-system,

/* 主卡片 */

.card {

    width:360px;

    padding:35px 30px;


    background:#ffffff;


    border-radius:30px;


    border:2px solid rgba(0,0,0,0.18);

}



/* 标题 */

.title {

    font-size:30px;

    font-weight:700;


    color:#000;


    margin-bottom:30px;

}



/* 按钮 */

.button {


    width:300px;

    height:58px;


    line-height:58px;


    margin:16px auto;


    display:block;


    border-radius:18px;


    background:#ffffff;


    border:1.5px solid rgba(0,0,0,0.18);


    color:#007aff;


    font-size:23px;


    font-weight:600;


    text-decoration:none;


    box-shadow:
    0 5px 12px rgba(0,0,0,0.08);


    transition:.2s;

}



.button:active {

    transform:scale(0.95);

}



/* 底部 */

.footer {

    margin-top:28px;

    color:#777;

    font-size:15px;

}



/* 深色模式 */

@media(prefers-color-scheme:dark){


body {

    background:#000000;

}

    background:#1c1c1e;


    border:2px solid rgba(255,255,255,0.45);


    box-shadow:
    0 15px 40px rgba(0,0,0,0.7);

    border:
