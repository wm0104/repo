<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>选择越狱管理器</title>


<style>

* {
    box-sizing:border-box;
}


body {

    margin:0;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;


    background:#f2f2f7;


    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    sans-serif;

}



/* 主卡片 */

.card {

    width:360px;

    padding:35px 30px;


    background:#ffffff;


    border-radius:30px;


    border:2px solid rgba(0,0,0,0.18);


    box-shadow:
    0 15px 40px rgba(0,0,0,0.15);


    text-align:center;

}



/* 标题 */

.title {

    font-size:30px;

    font-weight:700;


    color:#000;


    margin-bottom:30px;

}



/* 按钮 */

.button {


    width:300px;

    height:58px;


    line-height:58px;


    margin:16px auto;


    display:block;


    border-radius:18px;


    background:#ffffff;


    border:1.5px solid rgba(0,0,0,0.18);


    color:#007aff;


    font-size:23px;


    font-weight:600;


    text-decoration:none;


    box-shadow:
    0 5px 12px rgba(0,0,0,0.08);


    transition:.2s;

}



.button:active {

    transform:scale(0.95);

}



/* 底部 */

.footer {

    margin-top:28px;

    color:#777;

    font-size:15px;

}



/* 深色模式 */

@media(prefers-color-scheme:dark){


body {

    background:#000000;

}



.card {


    background:#1c1c1e;


    border:2px solid rgba(255,255,255,0.45);


    box-shadow:
    0 15px 40px rgba(0,0,0,0.7);

}



.title {

    color:#ffffff;

}



.button {


    background:#2c2c2e;


    border:
    1.5px solid rgba(255,255,255,0.35);


    color:#0a84ff;


}



.footer {

    color:#aaaaaa;

}


}



</style>

</head>



<body>


<div class="card">


<div class="title">
选择越狱管理器
</div>



<a class="button"
href="sileo://source/https://wm0104.github.io/repo/">
Sileo
</a>



<a class="button"
href="saily://source/https://wm0104.github.io/repo/">
Saily
</a>



<a class="button"
href="zbra://sources/add/https://wm0104.github.io/repo/">
Zebra
</a>



<div class="footer">
wm0104 repo
</div>



</div>


</body>


</html>
