<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>添加源</title>


<style>

html {
    -webkit-text-size-adjust:100%;
}


* {
    box-sizing:border-box;
}


body {

    margin:0;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;


    background:#f2f2f7;


    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    sans-serif;

}



/* 卡片 */

.card {

    width:360px;

    padding:35px 30px;


    background:rgba(255,255,255,0.75);


    backdrop-filter:blur(20px);


    border-radius:30px;


    text-align:center;


    box-shadow:
    0 20px 50px rgba(0,0,0,0.15);

}



/* 标题 */

.title {

    font-size:28px;

    font-weight:700;


    color:#000;


    margin-bottom:30px;

}



/* 按钮 */

.button {


    width:300px;

    height:55px;


    line-height:55px;


    margin:15px auto;


    display:block;


    border-radius:18px;


    background:#ffffff;


    color:#007aff;


    font-size:22px;


    font-weight:600;


    text-decoration:none;


    transition:.2s;

}



.button:active {

    transform:scale(0.95);

}



/* 底部 */

.footer {

    margin-top:25px;

    color:#666;

    font-size:14px;

}



/* 深色模式 */

@media (prefers-color-scheme: dark) {


body {

    background:#000000;

}



.card {

    background:rgba(30,30,30,0.75);

    box-shadow:
    0 20px 50px rgba(0,0,0,0.5);

}



.title {

    color:white;

}



.button {

    background:#1c1c1e;

    color:#0a84ff;

}



.footer {

    color:#999;

}


}



</style>


</head>



<body>


<div class="card">


<div class="title">
选择添加源
</div>



<a class="button"
href="sileo://source/https://wm0104.github.io/repo/">
Sileo
</a>



<a class="button"
href="saily://source/https://wm0104.github.io/repo/">
Saily
</a>



<a class="button"
href="zbra://sources/add/https://wm0104.github.io/repo/">
Zebra
</a>



<div class="footer">
wm0104 repo
</div>



</div>


</body>


</html>
