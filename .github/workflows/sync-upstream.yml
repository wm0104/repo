name: 更新插件

on:
  workflow_dispatch:
    inputs:
      saved_package:
        description: '选择全部已登记插件或某个插件（不读取设备状态）'
        required: true
        type: choice
        default: 全部已登记插件
        options:
        # BEGIN SAVED PACKAGE OPTIONS
          - "全部已登记插件"
          - "Apelin [wiki.qaq.apelin]"
          - "Apelin App Development [wiki.qaq.apelin.dev.app]"
          - "Apelin Assembler [wiki.qaq.apelin.agent-tools.assembler]"
          - "Apelin Command-Line Tool Development [wiki.qaq.apelin.dev.cli]"
          - "Apelin Disassembler [wiki.qaq.apelin.agent-tools.disassembler]"
          - "Apelin Preference Bundle Development [wiki.qaq.apelin.dev.preferences]"
          - "Apelin Tweak Development [wiki.qaq.apelin.dev.tweak]"
          - "Hello 120Hz [cn.zqbb.fix120hz]"
          - "Hello App [cn.zqbb.disupdateapp]"
          - "Hello CPU [cn.zqbb.holdcpu]"
          - "HelloJailPort [cn.zqbb.hello.jailport]"
          - "HelloKeyboardPort [cn.zqbb.hello.keyboardport]"
          - "微信去广告 FuckWeChatAds [com.susu.fuckwechatadss]"
          - "电话助手iOS16-正式版(Roothide) [com.xybp888.callassist16.dopamine.roothide]"
        # END SAVED PACKAGE OPTIONS

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev bzip2 xz-utils zstd
      - name: Test synchronization and existing repository behavior
        run: python3 -m unittest discover -s testsuite -v
      - name: Prepare selected packages and saved choices without write credentials
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_ENTRY: update
          UPSTREAM_SAVED_PACKAGE: ${{ inputs.saved_package }}
          WORKFLOW_WRITE_CONFIGURED: ${{ secrets.WORKFLOW_WRITE_TOKEN != '' }}
        run: python3 scripts/manage_saved.py prepare
      - name: Commit verified changes and request existing publisher
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_WRITE_TOKEN: ${{ secrets.WORKFLOW_WRITE_TOKEN }}
        run: python3 scripts/manage_saved.py publish
