name: 同步插件

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev bzip2 xz-utils zstd
      - name: Test synchronization and existing repository behavior
        run: python3 -m unittest discover -s testsuite -v
      - name: Sync validated upstream packages and request existing publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_upstream.py
