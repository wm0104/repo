name: 同步单个上游插件

on:
  workflow_dispatch:
    inputs:
      repo:
        description: '上游 GitHub 仓库（作者/仓库名，不填网址）'
        required: true
        type: string
      package:
        description: '插件真实 Package（不是显示名称或文件名）'
        required: true
        type: string
      section:
        description: 'Sileo 分组（例如：工具、美化、乌龙）'
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev bzip2 xz-utils zstd
      - name: Test synchronization and existing repository behavior
        run: python3 -m unittest discover -s testsuite -v
      - name: Sync selected package and request existing publisher
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: ${{ inputs.repo }}
          UPSTREAM_PACKAGE: ${{ inputs.package }}
          UPSTREAM_SECTION: ${{ inputs.section }}
        run: python3 scripts/sync_upstream.py --single
