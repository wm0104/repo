name: "refresh"

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 xz-utils zstd

      - name: Refresh Packages
        run: |
          rm -f Packages Packages.bz2 Packages.xz Packages.zst

          echo "Generate Packages..."

          dpkg-scanpackages -m ./debs /dev/null > Packages


          echo "Classify by Architecture..."

          python3 <<'EOF'
          from pathlib import Path

          path = Path("Packages")
          content = path.read_text()

          packages = content.split("\n\n")

          output = []

          for package in packages:
              if "Architecture: iphoneos-arm64e" in package:
                  lines = package.splitlines()

                  lines = [
                      "Section: 隐根插件"
                      if line.startswith("Section:")
                      else line
                      for line in lines
                  ]

                  package = "\n".join(lines)


              elif "Architecture: iphoneos-arm64" in package:
                  lines = package.splitlines()

                  lines = [
                      "Section: 无根插件"
                      if line.startswith("Section:")
                      else line
                      for line in lines
                  ]

                  package = "\n".join(lines)


              output.append(package)


          path.write_text("\n\n".join(output))
          EOF


          echo "Compress Packages..."

          bzip2 -k -9 Packages
          xz -k -9 --extreme Packages
          zstd -19 -f Packages -o Packages.zst


      - name: Commit changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          git add Packages Packages.bz2 Packages.xz Packages.zst

          if ! git diff --cached --quiet; then
            git commit -m "Refresh Packages"
            git push
          fi


      - name: Download remove_all_actions
        run: |
          sudo curl -L -o /usr/bin/remove_all_actions \
            https://raw.githubusercontent.com/invalidunit/action/main/remove_all_actions

          sudo chmod 755 /usr/bin/remove_all_actions


      - name: Remove old Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          remove_all_actions