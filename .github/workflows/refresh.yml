name: "refresh"

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 xz-utils zstd

      - name: Refresh Packages
        run: |
          rm -f Packages Packages.bz2 Packages.xz Packages.zst

          dpkg-scanpackages -m ./debs /dev/null > Packages

          # 将所有 Section 修改为「隐根插件」
          sed -i 's/^Section:.*$/Section: 隐根插件/g' Packages

          bzip2 -k -9 Packages
          xz -k -9 --extreme Packages
          zstd -19 -f Packages -o Packages.zst

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          git add Packages Packages.bz2 Packages.xz Packages.zst

          if ! git diff --cached --quiet; then
            git commit -m "Refresh Packages"
            git push
          fi

      - name: Download remove_all_actions
        run: |
          sudo curl -L -o /usr/bin/remove_all_actions \
            https://raw.githubusercontent.com/invalidunit/action/main/remove_all_actions
          sudo chmod 755 /usr/bin/remove_all_actions

      - name: Remove old Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          remove_all_actions