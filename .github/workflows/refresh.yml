name: pages build and deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pages-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ github.token }}

      - name: Install Dependencies
        run: |
          sudo apt update -qq
          sudo apt install dpkg-dev bzip2 xz-utils zstd apt-utils -y

      - name: Modify deb Section field
        run: |
          shopt -s nullglob
          # RootHide 插件
          for debfile in ./debs/roothide/*.deb;
          do
              TMPDIR=$(mktemp -d)
              dpkg-deb -x "$debfile" "$TMPDIR"
              dpkg-deb -e "$debfile" "$TMPDIR/DEBIAN"
              sed -i 's/^Section:.*/Section: RootHide/' "$TMPDIR/DEBIAN/control"
              find "$TMPDIR" -type d -exec chmod 755 {} \;
              find "$TMPDIR" -type f -exec chmod 644 {} \;
              dpkg-deb -b "$TMPDIR" "$debfile"
              rm -rf "$TMPDIR"
          done
          # Rootless 插件
          for debfile in ./debs/rootless/*.deb;
          do
              TMPDIR=$(mktemp -d)
              dpkg-deb -x "$debfile" "$TMPDIR"
              dpkg-deb -e "$debfile" "$TMPDIR/DEBIAN"
              sed -i 's/^Section:.*/Section: Rootless/' "$TMPDIR/DEBIAN/control"
              find "$TMPDIR" -type d -exec chmod 755 {} \;
              find "$TMPDIR" -type f -exec chmod 644 {} \;
              dpkg-deb -b "$TMPDIR" "$debfile"
              rm -rf "$TMPDIR"
          done

      - name: Refresh Packages & Release
        run: |
          sudo chmod -R 755 ./debs/
          sudo chown -R $(id -u):$(id -g) ./debs/
          rm -rf ./Packages* Release
          dpkg-scanpackages -m ./debs /dev/null > ./Packages
          bzip2 -k -f Packages
          xz -k -f --extreme Packages
          zstd -k -f --ultra Packages
          # 写入你固定的Release头部，不会被覆盖！
          cat > Release <<EOF
Origin: wm0104
Label: 个人自用备份
Suite: ./
Codename: ios
Architectures: iphoneos-arm64e
Components: main
Description: 仅备份
EOF
          apt-ftparchive release . | grep -vE '^(Origin|Label|Suite|Codename|Architectures|Components|Description):' >> Release

      - name: Configure Git
        run: |
          git config user.email 'action@github.com'
          git config user.name 'GitHub Action'

      - name: Commit Changes
        run: |
          git add .
          if ! git diff --staged --quiet; then
            git commit -m 'Refresh Packages'
          fi

      - name: Push Changes
        if: github.ref == 'refs/heads/main'
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git remote set-url origin https://${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git push origin main

      - name: Download remove_all_actions
        run: |
          sudo curl -L -o '/usr/bin/remove_all_actions' 'https://raw.githubusercontent.com/invalidunit/action/main/remove_all_actions'
          sudo chmod 0755 '/usr/bin/remove_all_actions'

      - name: Remove All Old Actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          remove_all_actions