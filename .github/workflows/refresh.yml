name: "refresh"

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install depend
        run: |
          sudo apt update >/dev/null 2>&1
          sudo apt install dpkg-dev bzip2 xz-utils zstd -y

      - name: Refresh Packages
        run: |
          rm -rf Packages Packages.bz2 Packages.xz Packages.zst

          chmod -R a+rX ./debs

          dpkg-scanpackages -m ./debs /dev/null > Packages

          bzip2 -k -9 Packages
          xz -k -9 --extreme Packages
          zstd --ultra -22 -k Packages -o Packages.zst

      - name: Save change if local change
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          git add .

          if ! git diff --staged --exit-code >/dev/null; then
            git commit -m "Refresh Packages"
            git push
          fi